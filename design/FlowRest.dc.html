<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #1a1b26; }
    a { color: #7aa2f7; } a:hover { color: #7dcfff; }
  </style>
</helmet>
<div style="width: 393px; height: 873px; background: #1a1b26; color: #c0caf5; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 17px; line-height: 1.45; padding: 14px; display: flex; flex-direction: column;">

  <div style="font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #c0caf5; border-bottom: 1px solid #2f3549; padding-bottom: 8px;">WATERSHED</div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px;">
    <div style="font-size: 13px; letter-spacing: 0.8px; color: #787c99;">WED 3 SEP</div>
    <div style="font-size: 13px; letter-spacing: 0.8px; color: #636c97;">THE LAST THREE WEEKS</div>
  </div>

  <div style="display: flex; margin-top: 16px;">
    <div style="width: 40px; flex-shrink: 0;"></div>
    <div style="width: 22px; flex-shrink: 0; font-size: 9px; letter-spacing: 0.3px; color: #7aa2f7;">JOB</div>
    <div style="width: 8px; flex-shrink: 0;"></div>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center; font-size: 10px; font-weight: 500; letter-spacing: 0.4px;">
      <div style="color: #9ece6a;">CRAFT</div>
      <div style="color: #73daca;">RECOVERY</div>
      <div style="color: #ff9e64;">BODY</div>
      <div style="color: #bb9af7;">LOVE</div>
    </div>
  </div>

  <div style="position: relative; margin-top: 8px; border-top: 1px solid #2f3549; border-bottom: 1px solid #2f3549;">

    <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="21">
        <div style="height: 25px; background: {{r.bg}};"></div>
      </sc-for>
    </div>

    <div style="position: relative; display: flex;">

      <div style="width: 40px; flex-shrink: 0; display: flex; flex-direction: column;">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="21">
          <div style="height: 25px; display: flex; align-items: center; font-size: 10px; letter-spacing: 0.5px; color: {{r.color}};">{{r.day}}</div>
        </sc-for>
      </div>

      <div style="width: 22px; flex-shrink: 0; display: flex; flex-direction: column;">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="21">
          <div style="height: 25px; background: {{r.job}};"></div>
        </sc-for>
      </div>
      <div style="width: 8px; flex-shrink: 0;"></div>

      <div style="flex-grow: 1; position: relative;">
        <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
          <div style="display: flex; justify-content: center;"><div style="width: 1px; background: #232838;"></div></div>
          <div style="display: flex; justify-content: center;"><div style="width: 1px; background: #232838;"></div></div>
          <div style="display: flex; justify-content: center;"><div style="width: 1px; background: #232838;"></div></div>
          <div style="display: flex; justify-content: center;"><div style="width: 1px; background: #232838;"></div></div>
        </div>
        <div style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="84">
            <div style="height: 25px; display: flex; align-items: center; justify-content: center;">
              <div style="width: {{c.px}}; height: {{c.px}}; background: {{c.fill}};"></div>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  </div>

  <div style="display: flex; gap: 16px; margin-top: 12px;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 10px; height: 10px; background: #c0caf5;"></div>
      <div style="font-size: 10px; letter-spacing: 0.8px; color: #787c99;">ENLARGED</div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 10px; height: 10px; background: rgba(192, 202, 245, 0.45);"></div>
      <div style="font-size: 10px; letter-spacing: 0.8px; color: #787c99;">DIMINISHED</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
    <div style="flex-grow: 1; height: 1px; background: #2f3549;"></div>
    <div style="font-size: 11px; letter-spacing: 0.8px; color: #4a5178;">ANSWERED — NO QUESTION TODAY</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; color: #636c97; border: 1px solid #2f3549; padding: 14px; font-size: 13px; letter-spacing: 1.5px;">ADD ANOTHER</div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":873}}'>
class Component extends DCLogic {
  fade(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
  }

  renderVals() {
    // Strings run oldest to newest; the stream runs newest first, so they reverse.
    // Today (last character) now carries the block just logged: a HALF A DAY, enlarged.
    const LANES = [
      { color: '#9ece6a', s: 'aa.a..bba.a..cbx.a..b' },
      { color: '#73daca', s: 'aaabaaaaaabaaaaaabaaa' },
      { color: '#ff9e64', s: '.....................' },
      { color: '#bb9af7', s: '.a..cb.a...bc.a...cb.' }
    ];
    const SIZE = { a: 8, b: 13, c: 18, x: 8, y: 13, z: 18 };
    const DAYS = ['WE 3', 'TU 2', 'MO 1',
                  'SU 31', 'SA 30', 'FR 29', 'TH 28', 'WE 27', 'TU 26', 'MO 25',
                  'SU 24', 'SA 23', 'FR 22', 'TH 21', 'WE 20', 'TU 19', 'MO 18',
                  'SU 17', 'SA 16', 'FR 15', 'TH 14'];

    // The job: one verdict a day, e enlarged, d diminished, dot for a day off.
    // It stopped enlarging him in the third week of August and has not started again.
    const JOB = 'ee..dddee..ddddd..ddd';

    const rows = DAYS.map((d, i) => {
      const weekend = d.charAt(0) === 'S';
      const j = JOB.charAt(20 - i);
      return {
        day: d,
        bg: weekend ? '#1d1e2a' : 'transparent',
        color: i === 0 ? '#c0caf5' : (weekend ? '#787c99' : '#636c97'),
        job: j === 'e' ? '#7aa2f7' : (j === 'd' ? this.fade('#7aa2f7', 0.45) : 'transparent')
      };
    });

    const cells = [];
    for (let i = 0; i < 21; i += 1) {
      for (const ln of LANES) {
        const ch = ln.s.charAt(20 - i);
        if (ch === '.' || ch === '') {
          cells.push({ px: '0px', fill: 'transparent' });
        } else if (ch === 'a' || ch === 'b' || ch === 'c') {
          cells.push({ px: SIZE[ch] + 'px', fill: ln.color });
        } else {
          cells.push({ px: SIZE[ch] + 'px', fill: this.fade(ln.color, 0.45) });
        }
      }
    }

    return { rows: rows, cells: cells };
  }
}
</script>
</body>
</html>
