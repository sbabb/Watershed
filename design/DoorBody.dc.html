<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #1a1b26; }
    a { color: #7aa2f7; } a:hover { color: #7dcfff; }
  </style>
</helmet>
<div style="width: 393px; height: 873px; background: #1a1b26; color: #c0caf5; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 17px; line-height: 1.45; padding: 14px; display: flex; flex-direction: column;">

  <div style="font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #c0caf5; border-bottom: 1px solid #2f3549; padding-bottom: 8px;">WATERSHED</div>

  <div style="flex-grow: 1;"></div>

  <div style="font-size: 10px; letter-spacing: 1.2px; color: #636c97;">THE LAST FEW HOURS</div>

  <div style="font-size: 23px; line-height: 1.55; color: #c0caf5; margin-top: 12px;">Did they enlarge you, or diminish you?</div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 26px;">
    <div style="border: 1px solid #3b4261; padding: 22px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 26px; height: 26px; background: #c0caf5; flex-shrink: 0;"></div>
      <div style="font-size: 17px; font-weight: 500; letter-spacing: 1.5px;">ENLARGED</div>
    </div>
    <div style="border: 1px solid #3b4261; padding: 22px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 26px; height: 26px; background: rgba(192, 202, 245, 0.45); flex-shrink: 0;"></div>
      <div style="font-size: 17px; font-weight: 500; letter-spacing: 1.5px;">DIMINISHED</div>
    </div>
  </div>

  <div style="font-size: 12px; line-height: 1.6; color: #636c97; margin-top: 20px;">Then you say what they were for, and how much of one.</div>

  <div style="flex-grow: 1;"></div>

  <div style="font-size: 13px; letter-spacing: 0.5px; color: #787c99;">NOTHING TO LOG &mdash; I CAME TO LOOK</div>

  <div style="display: flex; align-items: center; gap: 12px; border-top: 1px solid #2f3549; padding-top: 14px; margin-top: 22px;">
    <div style="font-size: 13px; letter-spacing: 0.8px; color: #636c97;">THE LAST THREE WEEKS</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 13px; letter-spacing: 0.8px; color: #636c97;">THE YEAR</div>
  </div>

</div>
</x-dc>
