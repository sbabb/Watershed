<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #1a1b26; }
    a { color: #7aa2f7; } a:hover { color: #7dcfff; }
  </style>
</helmet>
<div style="width: 393px; height: 873px; background: #1a1b26; color: #c0caf5; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 17px; line-height: 1.45; padding: 14px; display: flex; flex-direction: column;">

  <div style="font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #c0caf5; border-bottom: 1px solid #2f3549; padding-bottom: 8px;">WATERSHED</div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px;">
    <div style="font-size: 13px; letter-spacing: 0.8px; color: #787c99;">SUN 7 SEP</div>
    <div style="font-size: 13px; letter-spacing: 0.8px; color: #636c97;">TAP A LANE TO LOG</div>
  </div>

  <div style="display: flex; margin-top: 16px;">
    <div style="width: 40px; flex-shrink: 0;"></div>
    <div style="width: 22px; flex-shrink: 0; font-size: 9px; letter-spacing: 0.3px; color: #7aa2f7;">JOB</div>
    <div style="width: 4px; flex-shrink: 0;"></div>
    <div style="width: 22px; flex-shrink: 0; font-size: 9px; letter-spacing: 0.3px; color: #73daca;">SBR</div>
    <div style="width: 8px; flex-shrink: 0;"></div>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center; font-size: 10px; font-weight: 500; letter-spacing: 0.4px;">
      <div style="color: #9ece6a;">CRAFT</div>
      <div style="color: #73daca;">RECOVERY</div>
      <div style="color: #ff9e64;">BODY</div>
      <div style="color: #bb9af7;">LOVE</div>
    </div>
  </div>

  <div style="margin-top: 8px; border-top: 1px solid #2f3549; border-bottom: 1px solid #2f3549;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="21">
      <div style="display: flex; height: 25px; background: {{r.bg}};">
        <div style="width: 40px; flex-shrink: 0; display: flex; align-items: center; font-size: 10px; letter-spacing: 0.5px; color: {{r.color}};">{{r.day}}</div>
        <div style="width: 22px; flex-shrink: 0; background: {{r.job}};"></div>
        <div style="width: 4px; flex-shrink: 0;"></div>
        <div style="width: 22px; flex-shrink: 0; background: {{r.sober}};"></div>
        <div style="width: 8px; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
          <div style="position: relative; display: flex; align-items: center; justify-content: center;"><div style="position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #232838;"></div><div style="position: relative; width: {{r.m0.px}}; height: {{r.m0.px}}; background: {{r.m0.fill}};"></div></div>
          <div style="position: relative; display: flex; align-items: center; justify-content: center;"><div style="position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #232838;"></div><div style="position: relative; width: {{r.m1.px}}; height: {{r.m1.px}}; background: {{r.m1.fill}};"></div></div>
          <div style="position: relative; display: flex; align-items: center; justify-content: center;"><div style="position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #232838;"></div><div style="position: relative; width: {{r.m2.px}}; height: {{r.m2.px}}; background: {{r.m2.fill}};"></div></div>
          <div style="position: relative; display: flex; align-items: center; justify-content: center;"><div style="position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #232838;"></div><div style="position: relative; width: {{r.m3.px}}; height: {{r.m3.px}}; background: {{r.m3.fill}};"></div></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 10px; height: 10px; background: #c0caf5;"></div>
      <div style="font-size: 10px; letter-spacing: 0.8px; color: #787c99;">ENLARGED</div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 10px; height: 10px; background: rgba(192, 202, 245, 0.45);"></div>
      <div style="font-size: 10px; letter-spacing: 0.8px; color: #787c99;">DIMINISHED</div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 14px; height: 10px; background: #73daca;"></div>
      <div style="font-size: 10px; letter-spacing: 0.8px; color: #787c99;">SOBER, 328 DAYS</div>
    </div>
  </div>

  <div style="margin-top: 14px; padding: 12px; background: #1f2335; border: 1px solid #2f3549;">
    <div style="font-size: 15px; line-height: 1.5; color: #c0caf5;">Slow Sunday. Wrote most of the afternoon, then the walk.</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
    <div style="flex-grow: 1; height: 1px; background: #2f3549;"></div>
    <div style="font-size: 11px; letter-spacing: 0.8px; color: #636c97;">YESTERDAY IS STILL OPEN</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; background: transparent; color: #9ece6a; border: 1px solid #9ece6a; padding: 15px; font-size: 15px; font-weight: 500; letter-spacing: 1.5px;">LOG A BLOCK</div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":873}}'>
class Component extends DCLogic {
  fade(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
  }

  mark(ch, color) {
    const SIZE = { a: 8, b: 13, c: 18, x: 8, y: 13, z: 18 };
    if (ch === '.') return { px: '0px', fill: 'transparent' };
    const solid = ch === 'a' || ch === 'b' || ch === 'c';
    return { px: SIZE[ch] + 'px', fill: solid ? color : this.fade(color, 0.45) };
  }

  renderVals() {
    // Strings run oldest to newest; the stream runs newest first, so they reverse.
    const LANES = [
      { color: '#9ece6a', s: 'a.a..bba.a..cbx.a..bb' },
      { color: '#73daca', s: 'aaaabaaaaaabaaaaaabaa' },
      { color: '#ff9e64', s: 'a................a.aa' },
      { color: '#bb9af7', s: '..a..cb.a...bc.a...cb' }
    ];
    const DAYS = ['SU 7', 'SA 6', 'FR 5', 'TH 4', 'WE 3', 'TU 2', 'MO 1',
                  'SU 31', 'SA 30', 'FR 29', 'TH 28', 'WE 27', 'TU 26', 'MO 25',
                  'SU 24', 'SA 23', 'FR 22', 'TH 21', 'WE 20', 'TU 19', 'MO 18'];
    // The job: one verdict a day, e enlarged, d diminished, dot for a day off.
    const JOB = 'eedee..eddde..dddee..';

    const rows = DAYS.map((d, i) => {
      const weekend = d.charAt(0) === 'S';
      const j = JOB.charAt(20 - i);
      return {
        day: d,
        bg: weekend ? '#1d1e2a' : 'transparent',
        color: i === 0 ? '#c0caf5' : (weekend ? '#787c99' : '#636c97'),
        job: j === 'e' ? '#7aa2f7' : (j === 'd' ? this.fade('#7aa2f7', 0.45) : 'transparent'),
        // Sober every day, which is the whole problem: twenty-one identical cells.
        sober: '#73daca',
        m0: this.mark(LANES[0].s.charAt(20 - i), LANES[0].color),
        m1: this.mark(LANES[1].s.charAt(20 - i), LANES[1].color),
        m2: this.mark(LANES[2].s.charAt(20 - i), LANES[2].color),
        m3: this.mark(LANES[3].s.charAt(20 - i), LANES[3].color)
      };
    });

    return { rows: rows };
  }
}
</script>
</body>
</html>
