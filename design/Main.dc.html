<script data-dc-script data-props='{"$preview":{"width":393,"height":873}}'>
class Component extends DCLogic {
  // Lowercase a/b/c enlarged, x/y/z diminished. Same footprint either way:
  // only the fill's opacity carries valence.
  parse(str, color) {
    const SIZE = { a: 6, b: 10, c: 14, x: 6, y: 10, z: 14 };
    const out = [];
    for (const ch of str) {
      if (ch === '.') {
        out.push({ px: '0px', fill: 'transparent' });
      } else if (ch === 'a' || ch === 'b' || ch === 'c') {
        out.push({ px: SIZE[ch] + 'px', fill: color });
      } else {
        out.push({ px: SIZE[ch] + 'px', fill: this.fade(color) });
      }
    }
    return out;
  }

  // 0.45 rather than the year board's 0.32: a 6px square needs more alpha than a
  // 28px bar to stay visible against #1a1b26.
  fade(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', 0.45)';
  }

  renderVals() {
    return {
      earning: this.parse('.b.cb..cy.b.c.b..yc.z', '#7aa2f7'),
      craft: this.parse('c..b..a...b.c..b..c.b', '#9ece6a'),
      people: this.parse('...a....b......a...b.', '#bb9af7'),
      body: this.parse('....................a', '#ff9e64'),
      becoming: this.parse('..a....a.....a....a..', '#73daca')
    };
  }
}
</script>
