# Publishes the app in app/ to GitHub Pages on every push to main.
#
# One-time setup in the repo: Settings -> Pages -> Source -> "GitHub Actions".
# GitHub Pages needs the repository to be public on a free plan; on Pro or
# above it can serve a private repo to signed-in collaborators only.
#
# There is no build step on purpose. app/ is plain HTML, CSS and one JS file,
# so what is published is exactly what is in the repo and what runs locally.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cheap insurance: a syntax error in app.js would publish a blank screen.
      - name: Check the app parses
        run: node --check app/app.js && node --check app/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
